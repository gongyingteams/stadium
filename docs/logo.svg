<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1986 1518" width="100%" height="100%">
  <!-- 透明背景，所有文字与图形均已转为高精度矢量路径，不依赖本地字体 -->
  <defs>
    <!-- 足球内部裁剪遮罩 -->
    <clipPath id="soccer-clip">
      <circle cx="891" cy="340" r="24" />
    </clipPath>
  </defs>

  <!-- ================= 1. 椭圆轨道后半段（被 T 与 ┴ 遮挡的部分） ================= -->
  <g fill="none" stroke="#6B6D70" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 顶部弧线穿入黑色T后方，以及底部从红色倒T穿出向上的弧线 -->
    <path d="M 891,340 C 937,265 986,277 994,395" />
    <path d="M 832,796 C 858,802 890,775 928,708" />
  </g>

  <!-- ================= 2. 顶部黑色 T 字与立体投影 ================= -->
  <g id="top-black-T">
    <!-- 灰色立体投影（向右上偏移 dx:+14, dy:-14） -->
    <path d="M 753,372 H 1146 V 469 H 1017 V 629 H 959 V 469 H 753 Z" fill="#8C9194" />
    <!-- 深褐黑主体 -->
    <path d="M 739,386 H 1132 V 483 H 1003 V 643 H 945 V 483 H 739 Z" fill="#221815" />
  </g>

  <!-- ================= 3. 底部红色倒 T 字与立体投影 ================= -->
  <g id="bottom-red-T">
    <!-- 灰色立体投影（向右上偏移 dx:+14, dy:-14） -->
    <path d="M 883,517 H 941 V 672 H 1146 V 769 H 753 V 672 H 883 Z" fill="#8C9194" />
    <!-- 红色主体 -->
    <path d="M 869,531 H 927 V 686 H 1132 V 783 H 739 V 686 H 869 Z" fill="#D91E18" />
  </g>

  <!-- ================= 4. 椭圆轨道前半段（跨越在黑 T 与红 ┴ 前方） ================= -->
  <g fill="none" stroke-linecap="round">
    <!-- 穿过黑色T横梁处的浅灰高光过渡段（原图细节还原） -->
    <path d="M 891,340 C 875,365 860,396 846,432" stroke="#9FA3A6" stroke-width="8.5" />
    <!-- 跨越前景的主轨道弧线 -->
    <path d="M 852,418 C 794,565 766,781 832,796" stroke="#6B6D70" stroke-width="8.5" />
  </g>

  <!-- ================= 5. 轨道上的黑白足球矢量图形 ================= -->
  <g id="soccer-ball">
    <!-- 球体白底 -->
    <circle cx="891" cy="340" r="24" fill="#FFFFFF" />
    <!-- 球面黑色五边形色块与缝线 -->
    <g clip-path="url(#soccer-clip)">
      <!-- 中心五边形 -->
      <polygon points="891,330 900,336 897,347 885,347 882,336" fill="#1A1513" />
      <!-- 边缘五边形块 -->
      <polygon points="884,312 898,312 895,321 887,321" fill="#1A1513" />
      <polygon points="909,322 920,332 912,339 906,331" fill="#1A1513" />
      <polygon points="914,349 905,363 899,356 904,348" fill="#1A1513" />
      <polygon points="877,363 868,349 878,348 883,356" fill="#1A1513" />
      <polygon points="862,332 873,322 876,331 870,339" fill="#1A1513" />
      <!-- 内部连接缝线 -->
      <g stroke="#1A1513" stroke-width="2.2">
        <line x1="891" y1="330" x2="891" y2="319" />
        <line x1="900" y1="336" x2="908" y2="333" />
        <line x1="897" y1="347" x2="903" y2="352" />
        <line x1="885" y1="347" x2="879" y2="352" />
        <line x1="882" y1="336" x2="874" y2="333" />
      </g>
    </g>
    <!-- 足球外圈黑边 -->
    <circle cx="891" cy="340" r="24" fill="none" stroke="#1A1513" stroke-width="3.2" />
  </g>

  <!-- ================= 6. 底部 JWHS 粗体字母（含右侧平行投影） ================= -->
  <g id="jwhs-letters">
    <!-- 灰色立体投影层（向右水平偏移 dx:+24） -->
    <g fill="#8C9194" transform="translate(24, 0)">
      <!-- J -->
      <path d="M 375,895 H 462 V 1072 C 462,1135 432,1188 327,1188 C 228,1188 188,1142 181,1069 L 265,1053 C 270,1096 289,1121 327,1121 C 362,1121 375,1099 375,1060 Z" />
      <!-- W -->
      <path d="M 500,895 H 588 L 628,1084 L 675,895 H 763 L 810,1084 L 850,895 H 937 L 855,1183 H 767 L 719,992 L 671,1183 H 583 Z" />
      <!-- H -->
      <path d="M 979,895 H 1066 V 999 H 1246 V 895 H 1333 V 1183 H 1246 V 1066 H 1066 V 1183 H 979 Z" />
      <!-- S -->
      <path d="M 1699,980 L 1613,986 C 1606,957 1581,945 1542,945 C 1502,945 1482,958 1482,974 C 1482,992 1508,998 1569,1007 C 1647,1018 1711,1035 1711,1099 C 1711,1155 1650,1189 1551,1189 C 1451,1189 1397,1152 1388,1083 L 1474,1076 C 1482,1112 1510,1127 1554,1127 C 1601,1127 1624,1112 1624,1095 C 1624,1075 1597,1069 1534,1059 C 1458,1047 1398,1030 1398,975 C 1398,922 1455,889 1544,889 C 1638,889 1689,925 1699,980 Z" />
    </g>

    <!-- 深褐黑字母主体层 -->
    <g fill="#221815">
      <!-- J -->
      <path d="M 375,895 H 462 V 1072 C 462,1135 432,1188 327,1188 C 228,1188 188,1142 181,1069 L 265,1053 C 270,1096 289,1121 327,1121 C 362,1121 375,1099 375,1060 Z" />
      <!-- W -->
      <path d="M 500,895 H 588 L 628,1084 L 675,895 H 763 L 810,1084 L 850,895 H 937 L 855,1183 H 767 L 719,992 L 671,1183 H 583 Z" />
      <!-- H -->
      <path d="M 979,895 H 1066 V 999 H 1246 V 895 H 1333 V 1183 H 1246 V 1066 H 1066 V 1183 H 979 Z" />
      <!-- S -->
      <path d="M 1699,980 L 1613,986 C 1606,957 1581,945 1542,945 C 1502,945 1482,958 1482,974 C 1482,992 1508,998 1569,1007 C 1647,1018 1711,1035 1711,1099 C 1711,1155 1650,1189 1551,1189 C 1451,1189 1397,1152 1388,1083 L 1474,1076 C 1482,1112 1510,1127 1554,1127 C 1601,1127 1624,1112 1624,1095 C 1624,1075 1597,1069 1534,1059 C 1458,1047 1398,1030 1398,975 C 1398,922 1455,889 1544,889 C 1638,889 1689,925 1699,980 Z" />
    </g>
  </g>

  <!-- ================= 7. 右上角注册商标 R 标（纯矢量路径） ================= -->
  <g id="registered-trademark">
    <!-- 外圆环 -->
    <circle cx="1765" cy="793" r="93" fill="none" stroke="#040000" stroke-width="8" />
    <!-- 内部 R 字母（已转曲，确保任何设备显示完全一致） -->
    <path d="M 1720,730 H 1776 C 1796,730 1810,735 1818,744 C 1825,751 1828,760 1828,770 C 1828,786 1817,798 1796,802 C 1805,805 1812,812 1817,824 L 1833,864 H 1815 L 1801,830 C 1795,815 1789,807 1782,805 C 1777,804 1770,803 1761,803 H 1736 V 864 H 1720 Z M 1736,744 V 790 H 1772 C 1788,790 1799,788 1804,784 C 1809,780 1812,775 1812,768 C 1812,760 1809,754 1803,750 C 1797,746 1788,744 1775,744 Z" fill="#040000" />
  </g>
</svg>